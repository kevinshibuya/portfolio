    <!-- The one font file, preloaded so it lands during HTML parse. -->

    <!-- Critical loader CSS, inlined so the ink loader paints with the first
         frame of HTML, before the bundled stylesheet arrives. It mirrors the
         LOADER block of src/index.css.

         Structure: a full-viewport ink SVG path with static "ks." glyph
         windows cut out of it (paths taken from Plus Jakarta Sans 700, so
         there is no font dependency) over a stand-in in the paint's colours that reads as
         paint before React mounts. On mount main.tsx thins the stand-in, so the live hero
         paint moves behind it, then contracts the ks. cutout slightly and
         explodes it outward until the viewport sits inside a letterform
         window: ink gone, page revealed. The corner labels are cream HTML on
         the ink. -->
    <style>
      html { background: #0B0E14; }
      html[data-loading='true'] { overflow: hidden; }
      /* The stylesheet's page-wide rules that reach the loader, copied so the
         loader is the same before and after the stylesheet applies (it no
         longer holds the first frame): the gutter sets the loader's width
         where scrollbars take space, the smoothing sets the labels' weight. */
      html, body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html {
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: rgba(120, 116, 110, 0.5) transparent;
        -webkit-text-size-adjust: 100%;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('/fonts/PlusJakartaSans-VariableFont_wght.woff2') format('woff2-variations'),
             url('/fonts/PlusJakartaSans-VariableFont_wght.woff2') format('woff2');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      #loader {
        position: fixed; inset: 0; z-index: 9999;
        pointer-events: none; overflow: hidden;
      }
      .loader-standin {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(60% 60% at 42% 46%, rgba(224, 48, 110, 0.95), transparent 75%),
          radial-gradient(60% 60% at 72% 58%, rgba(141, 168, 242, 0.7), transparent 75%),
          #D94300;
        opacity: 1;
        transition: opacity 300ms ease-out;
        animation: loaderStandinDrift 7s ease-in-out infinite alternate;
        will-change: transform;
      }
      @keyframes loaderStandinDrift {
        from { transform: scale(1) translate3d(0, 0, 0); }
        to   { transform: scale(1.05) translate3d(-1.5%, 1.5%, 0); }
      }
      #loader.loader--mounted .loader-standin { opacity: 0.5; }
      .loader-ink { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; }
      .loader-meta {
        position: absolute; z-index: 2;
        display: flex; flex-direction: column; gap: 2px;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 13px; font-weight: 400; line-height: 1.4; letter-spacing: 0;
        text-transform: lowercase; color: #F5F2EC;
      }
      /* The labels are never seen in the fallback font: they show once the
         face has loaded (the script below), so on a slow connection the ink
         and the mark can paint before the font arrives. */
      .loader-meta { visibility: hidden; }
      html[data-loader-font] .loader-meta { visibility: visible; }
      .loader-meta--bl { bottom: 28px; left: 28px; text-align: left; }
      .loader-meta--br { bottom: 28px; right: 28px; text-align: right; }
      @media (max-width: 640px) {
        .loader-meta--bl { left: 20px; }
        .loader-meta--br { right: 20px; }
      }
      /* Reduced motion: no explosion. The whole loader fades; the stand-in is still. */
      @media (prefers-reduced-motion: reduce) {
        #loader { transition: opacity 150ms ease-out; }
        #loader.loader--exit { opacity: 0; }
        .loader-standin { transition: none; animation: none; }
      }
    </style>
    <script>
      // The page is scroll-locked while the loader is up. Set here, before
      // React parses, so the first render is already locked; main.tsx clears
      // the attribute when it takes the loader away. Only <html> exists at
      // this point, so the lock lives on it.
      document.documentElement.dataset.loading = 'true'
      // The loader's labels wait for their face (CSS above): shown once it has
      // loaded, or after 3 s, as font-display: block would.
      ;(function () {
        var root = document.documentElement
        var show = function () { root.dataset.loaderFont = '' }
        try { document.fonts.load("400 13px 'Plus Jakarta Sans'").then(show, show) } catch (e) { show() }
        setTimeout(show, 3000)
      })()
    </script>

    <!-- LOADER: an ink sheet with ks. windows over a stand-in in the paint's colours; main.tsx
         contracts then explodes the cutout to reveal the page. -->
    <div id="loader" aria-hidden="true">
      <div class="loader-standin"></div>
      <svg class="loader-ink" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <!-- One path, filled even-odd: a sheet wider than any screen (the reach the mask's rect had) with
             the three glyphs as holes in it. It is not a <mask>: a mask is
             redrawn on the processor for every frame of the exit, the whole
             screen at the device's pixel ratio, and a phone cannot keep up
             (16 frames a second in WebKit at a ratio of 3; this holds 60).
             main.tsx scales the group, sheet and holes together. -->
        <g class="loader-ks">
          <!-- translate-x centers the "ks" letters optically (60.5–1021.5
               glyph → mark center at viewBox 50); the trailing "." hangs
               right of center by design and is excluded from centering. -->
          <path

            fill="#0B0E14"
            fill-rule="evenodd"
            d="M-2100 -2100H3000V3000H-2100Z M60.5 -12L60.5 745L191.75 745L191.75 579.63L262.64 503.33L414.75 745L564.75 745L359.75 420.25L560.75 201.5L397.75 201.5L191.75 417.16L191.75 -12Z M814.5 757.0Q727.75 757.0 663.375 715.375Q599.0 673.75 574.5 603.0L672.75 556.5Q694.25 601.75 731.625 627.75Q769.0 653.75 814.5 653.75Q850.5 653.75 871.5 638.125Q892.5 622.5 892.5 595.75Q892.5 579.75 884.0 569.25Q875.5 558.75 861.25 551.25Q847.0 543.75 829.5 539.0L740.5 514.0Q671.75 494.5 636.5 453.125Q601.25 411.75 601.25 355.75Q601.25 305.75 626.75 268.5Q652.25 231.25 697.75 210.375Q743.25 189.5 801.5 189.5Q878.5 189.5 937.75 226.5Q997.0 263.5 1021.5 330.25L922.25 376.75Q908.25 340.0 875.25 318.25Q842.25 296.5 800.75 296.5Q767.75 296.5 748.625 311.25Q729.5 326.0 729.5 350.5Q729.5 365.5 737.5 376.25Q745.5 387.0 760.25 394.25Q775.0 401.5 793.5 407.0L881.0 433.0Q948.25 452.75 984.375 493.125Q1020.5 533.5 1020.5 591.25Q1020.5 640.5 994.5 677.75Q968.5 715.0 922.5 736.0Q876.5 757.0 814.5 757.0Z M1153.5 745.0V605.0H1286.0V745.0Z"
          />
        </g>
